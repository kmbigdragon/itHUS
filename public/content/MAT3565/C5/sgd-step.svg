<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#003C43"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="320" rx="10" fill="#ffffff" stroke="#d6e4e3"/><text x="320.0" y="26.0" font-size="15" fill="#003C43" text-anchor="middle" font-weight="600">Một bước SGD trên một đánh giá rₓᵢ = 5, với η = 0.1 và λ₁ = λ₂ = 0.1</text><rect x="12.0" y="44.0" width="112.0" height="46.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="71.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bắt đầu</text><rect x="134.0" y="44.0" width="490.0" height="46.0" rx="5" fill="#E3FEF7" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="71.7" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">qᵢ = (0.50, 0.50), pₓ = (1.00, 2.00), dự đoán qᵢ · pₓ = 1.50</text><rect x="12.0" y="98.0" width="112.0" height="46.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="125.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 1</text><rect x="134.0" y="98.0" width="490.0" height="46.0" rx="5" fill="#fde68a" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="125.7" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">Sai số: ε = 2(rₓᵢ − qᵢ · pₓ) = 2(5 − 1.50) = 7.00</text><rect x="12.0" y="152.0" width="112.0" height="46.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="179.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 2</text><rect x="134.0" y="152.0" width="490.0" height="46.0" rx="5" fill="#bae6fd" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="179.7" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">qᵢ ← qᵢ + η(ε pₓ − 2λ₂ qᵢ) = (1.19, 1.89)</text><rect x="12.0" y="206.0" width="112.0" height="46.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="233.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 3</text><rect x="134.0" y="206.0" width="490.0" height="46.0" rx="5" fill="#bae6fd" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="233.7" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">pₓ ← pₓ + η(ε qᵢ − 2λ₁ pₓ) = (1.33, 2.31)</text><rect x="12.0" y="260.0" width="112.0" height="46.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="287.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Kết quả</text><rect x="134.0" y="260.0" width="490.0" height="46.0" rx="5" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="287.7" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">Dự đoán mới qᵢ · pₓ = 5.95. Bước này đi hơi lố so với 5 vì η lớn</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#003C43"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="316" rx="10" fill="#ffffff" stroke="#d6e4e3"/><text x="320.0" y="26.0" font-size="15" fill="#003C43" text-anchor="middle" font-weight="600">BALANCE tổng quát: A₁ (giá 1, ngân sách 110), A₂ (giá 10, ngân sách 100), 10 truy vấn q</text><rect x="14.0" y="44.0" width="170.0" height="30.0" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="99.0" y="63.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="600">Cách chọn</text><rect x="184.0" y="44.0" width="322.0" height="30.0" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="345.0" y="63.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="600">Tiêu chí</text><rect x="506.0" y="44.0" width="120.0" height="30.0" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="566.0" y="63.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="600">Doanh thu</text><rect x="14.0" y="74.0" width="170.0" height="30.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="99.0" y="93.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">BALANCE thường</text><rect x="184.0" y="74.0" width="322.0" height="30.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="345.0" y="93.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">Ngân sách còn lại lớn nhất</text><rect x="506.0" y="74.0" width="120.0" height="30.0" rx="0" fill="#fecaca" stroke="#94a3b8" stroke-width="1"/><text x="566.0" y="93.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">10</text><rect x="14.0" y="104.0" width="170.0" height="30.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="99.0" y="123.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">BALANCE tổng quát</text><rect x="184.0" y="104.0" width="322.0" height="30.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="345.0" y="123.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">ψᵢ(q) = xᵢ(1 − e^(−fᵢ)) lớn nhất</text><rect x="506.0" y="104.0" width="120.0" height="30.0" rx="0" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1"/><text x="566.0" y="123.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">100</text><rect x="14.0" y="134.0" width="170.0" height="30.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="99.0" y="153.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">Tối ưu</text><rect x="184.0" y="134.0" width="322.0" height="30.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="345.0" y="153.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal"></text><rect x="506.0" y="134.0" width="120.0" height="30.0" rx="0" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1"/><text x="566.0" y="153.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">100</text><text x="14.0" y="188.0" font-size="12.5" fill="#003C43" text-anchor="start" font-weight="600">Tính ở truy vấn đầu tiên, khi fᵢ = 1:</text><text x="14.0" y="212.0" font-size="13" fill="#003C43" text-anchor="start" font-weight="normal">ψ₁ = 1 × (1 − 1/e) = 0.632</text><text x="14.0" y="236.0" font-size="13" fill="#003C43" text-anchor="start" font-weight="normal">ψ₂ = 10 × (1 − 1/e) = 6.321, nên chọn A₂.</text><text x="14.0" y="268.0" font-size="12.5" fill="#003C43" text-anchor="start" font-weight="normal">Đến truy vấn thứ 10, A₂ đã tiêu 90 nên f₂ = 0.1: ψ₂ = 10 × (1 − e^(−0.1)) = 0.952, vẫn lớn hơn ψ₁.</text></svg>

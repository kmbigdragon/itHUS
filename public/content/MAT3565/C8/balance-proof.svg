<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#003C43"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="300" rx="10" fill="#ffffff" stroke="#d6e4e3"/><text x="320.0" y="26.0" font-size="15" fill="#003C43" text-anchor="middle" font-weight="600">Chứng minh tỉ số 3/4 khi có hai nhà quảng cáo, mỗi người ngân sách B</text><text x="155.0" y="54.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Tối ưu</text><text x="100.0" y="268.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">A₁</text><text x="210.0" y="268.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">A₂</text><line x1="56.0" y1="250.0" x2="260.0" y2="250.0" stroke="#64748b" stroke-width="1.2"/><text x="425.0" y="54.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">BALANCE</text><text x="370.0" y="268.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">A₁</text><text x="480.0" y="268.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">A₂</text><line x1="326.0" y1="250.0" x2="530.0" y2="250.0" stroke="#64748b" stroke-width="1.2"/><rect x="60.0" y="90.0" width="80.0" height="160.0" rx="0" fill="#bae6fd" stroke="#94a3b8" stroke-width="1"/><text x="100.0" y="175.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">B</text><rect x="170.0" y="90.0" width="80.0" height="160.0" rx="0" fill="#fde68a" stroke="#94a3b8" stroke-width="1"/><text x="210.0" y="175.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">B</text><rect x="330.0" y="170.0" width="80.0" height="80.0" rx="0" fill="#bae6fd" stroke="#94a3b8" stroke-width="1"/><text x="370.0" y="214.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="normal">y</text><rect x="330.0" y="90.0" width="80.0" height="80.0" rx="0" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="5 4"/><text x="370.0" y="134.0" font-size="12" fill="#003C43" text-anchor="middle" font-weight="normal">x (trống)</text><rect x="440.0" y="170.0" width="80.0" height="80.0" rx="0" fill="#bae6fd" stroke="#94a3b8" stroke-width="1"/><rect x="440.0" y="90.0" width="80.0" height="80.0" rx="0" fill="#fde68a" stroke="#94a3b8" stroke-width="1"/><text x="526.0" y="175.0" font-size="13" fill="#003C43" text-anchor="start" font-weight="normal">B</text><text x="544.0" y="110.0" font-size="12" fill="#003C43" text-anchor="start" font-weight="600">Doanh thu</text><text x="544.0" y="130.0" font-size="12" fill="#003C43" text-anchor="start" font-weight="normal">= 2B − x</text><text x="544.0" y="150.0" font-size="12" fill="#003C43" text-anchor="start" font-weight="normal">= B + y</text><text x="544.0" y="180.0" font-size="12" fill="#003C43" text-anchor="start" font-weight="normal">x + y = B</text><text x="544.0" y="204.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="600">y ≥ B/2</text><text x="544.0" y="224.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">nên nhỏ nhất</text><text x="544.0" y="242.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">là 3B/2</text><text x="320.0" y="290.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="normal">Xanh: truy vấn tối ưu giao cho A₁. Vàng: cho A₂. x truy vấn không dùng đều thuộc phần vàng.</text></svg>

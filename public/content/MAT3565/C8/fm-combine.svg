" height="38.0" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="350.0" y="67.1" font-size="11.5" fill="#003C43" text-anchor="middle" font-weight="600">Kết quả</text><rect x="386.0" y="44.0" width="240.0" height="38.0" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="506.0" y="67.1" font-size="11.5" fill="#003C43" text-anchor="middle" font-weight="600">Vấn đề</text><rect x="14.0" y="82.0" width="300.0" height="38.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="164.0" y="105.1" font-size="11.5" fill="#003C43" text-anchor="middle" font-weight="normal">Trung bình tất cả</text><rect x="314.0" y="82.0" width="72.0" height="38.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="350.0" y="105.1" font-size="11.5" fill="#003C43" text-anchor="middle" font-weight="normal">2477</text><rect x="386.0" y="82.0" width="240.0" height="38.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="506.0" y="105.1" font-size="11.5" fill="#003C43" text-anchor="middle" font-weight="normal">Một giá trị rất lớn kéo lệch cả kết quả</text><rect x="14.0" y="120.0" width="300.0" height="38.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="164.0" y="143.1" font-size="11.5" fill="#003C43" text-anchor="middle" font-weight="normal">Trung vị tất cả</text><rect x="314.0" y="120.0" width="72.0" height="38.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="350.0" y="143.1" font-size="11.5" fill="#003C43" text-anchor="middle" font-weight="normal">1024</text><rect x="386.0" y="120.0" width="240.0" height="38.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="506.0" y="143.1" font-size="11.5" fill="#003C43" text-anchor="middle" font-weight="normal">Luôn là lũy thừa của 2</text><rect x="14.0" y="158.0" width="300.0" height="38.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="164.0" y="181.1" font-size="11.5" fill="#003C43" text-anchor="middle" font-weight="normal">Chia nhóm 8: trung vị từng nhóm, rồi trung bình</text><rect x="314.0" y="158.0" width="72.0" height="38.0" rx="0" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1"/><text x="350.0" y="181.1" font-size="11.5" fill="#003C43" text-anchor="middle" font-weight="normal">1157</text><rect x="386.0" y="158.0" width="240.0" height="38.0" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="506.0" y="181.1" font-size="11.5" fill="#003C43" text-anchor="middle" font-weight="normal">Cách của slide: khử được cả hai vấn đề</text><text x="320.0" y="226.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">Các giá trị 2ᴿ gặp được: 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536</text><text x="320.0" y="252.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">Vì E[2ᴿ] là vô hạn: xác suất giảm một nửa khi R tăng 1, nhưng giá trị lại tăng gấp đôi.</text></svg>

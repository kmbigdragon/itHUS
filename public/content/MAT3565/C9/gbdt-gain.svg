<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" width="640" height="336" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#003C43"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="336" rx="10" fill="#ffffff" stroke="#d6e4e3"/><text x="320.0" y="26.0" font-size="15" fill="#003C43" text-anchor="middle" font-weight="600">Một phép tách ở vòng 1 với mất mát bình phương: g = 2(ŷ − y), h = 2</text><rect x="12.0" y="42.0" width="112.0" height="40.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="66.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bắt đầu</text><rect x="134.0" y="42.0" width="490.0" height="40.0" rx="5" fill="#E3FEF7" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="66.3" font-size="12" fill="#003C43" text-anchor="middle" font-weight="normal">ŷ⁽⁰⁾ = trung bình y = 0.270, tính g và h của 24 điểm</text><rect x="12.0" y="89.0" width="112.0" height="40.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="113.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 1</text><rect x="134.0" y="89.0" width="490.0" height="40.0" rx="5" fill="#bae6fd" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="113.3" font-size="12" fill="#003C43" text-anchor="middle" font-weight="normal">Thử mọi ngưỡng trên x, tốt nhất là x &lt; 5.00</text><rect x="12.0" y="136.0" width="112.0" height="40.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="160.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 2</text><rect x="134.0" y="136.0" width="490.0" height="40.0" rx="5" fill="#bae6fd" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="160.3" font-size="12" fill="#003C43" text-anchor="middle" font-weight="normal">G_L = -26.81, H_L = 24,  G_R = 26.81, H_R = 24</text><rect x="12.0" y="183.0" width="112.0" height="40.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="207.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 3</text><rect x="134.0" y="183.0" width="490.0" height="40.0" rx="5" fill="#fde68a" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="207.3" font-size="12" fill="#003C43" text-anchor="middle" font-weight="normal">Gain = ½ [G_L²/(H_L+λ) + G_R²/(H_R+λ) − (G_L+G_R)²/(H_L+H_R+λ)] = 28.74</text><rect x="12.0" y="230.0" width="112.0" height="40.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="254.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 4</text><rect x="134.0" y="230.0" width="490.0" height="40.0" rx="5" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="254.3" font-size="12" fill="#003C43" text-anchor="middle" font-weight="normal">Nếu dừng ở đây: w* = −G/(H+λ), w_L = 1.072, w_R = -1.072</text><rect x="12.0" y="277.0" width="112.0" height="40.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="301.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 5</text><rect x="134.0" y="277.0" width="490.0" height="40.0" rx="5" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="301.3" font-size="12" fill="#003C43" text-anchor="middle" font-weight="normal">Cập nhật ŷ⁽¹⁾ = ŷ⁽⁰⁾ + ε f₁(x) với ε = 0.3, rồi sang vòng 2</text></svg>

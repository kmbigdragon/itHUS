<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" width="640" height="346" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#003C43"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="346" rx="10" fill="#ffffff" stroke="#d6e4e3"/><text x="320.0" y="26.0" font-size="15" fill="#003C43" text-anchor="middle" font-weight="600">Một tầng GNN tại đỉnh A: lấy trung bình láng giềng rồi cộng phần của chính nó, σ = ReLU</text><rect x="12.0" y="42.0" width="112.0" height="42.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="67.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Đầu vào</text><rect x="134.0" y="42.0" width="490.0" height="42.0" rx="5" fill="#E3FEF7" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="67.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">h(A) = (1, 2), h(B) = (2, 0), h(C) = (0, 3), h(D) = (4, 1)</text><rect x="12.0" y="91.0" width="112.0" height="42.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="116.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 1</text><rect x="134.0" y="91.0" width="490.0" height="42.0" rx="5" fill="#bae6fd" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="116.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">Trung bình láng giềng: (h(B) + h(C) + h(D)) / 3 = (2, 1.33)</text><rect x="12.0" y="140.0" width="112.0" height="42.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="165.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 2</text><rect x="134.0" y="140.0" width="490.0" height="42.0" rx="5" fill="#bae6fd" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="165.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">Biến đổi: W × (2, 1.33) = (1, 1.33), với W = diag(0.5, 1)</text><rect x="12.0" y="189.0" width="112.0" height="42.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="214.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 3</text><rect x="134.0" y="189.0" width="490.0" height="42.0" rx="5" fill="#fde68a" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="214.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">Phần của A: B × h(A) = (1, 1), với B = diag(1, 0.5)</text><rect x="12.0" y="238.0" width="112.0" height="42.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="263.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 4</text><rect x="134.0" y="238.0" width="490.0" height="42.0" rx="5" fill="#fde68a" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="263.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">Cộng lại: (1, 1.33) + (1, 1) = (2, 2.33)</text><rect x="12.0" y="287.0" width="112.0" height="42.0" rx="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><text x="68.0" y="312.0" font-size="13" fill="#003C43" text-anchor="middle" font-weight="600">Bước 5</text><rect x="134.0" y="287.0" width="490.0" height="42.0" rx="5" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1.3"/><text x="379.0" y="312.5" font-size="12.5" fill="#003C43" text-anchor="middle" font-weight="normal">σ = ReLU giữ nguyên số dương: h(A) mới = (2, 2.33)</text></svg>

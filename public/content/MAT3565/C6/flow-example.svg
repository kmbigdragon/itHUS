n> / 2</text><text x="300.0" y="196.0" font-size="12.5" fill="#003C43" text-anchor="start" font-weight="normal">Thêm điều kiện r<tspan dy="4" font-size="10">y</tspan><tspan dy="-4">​</tspan> + r<tspan dy="4" font-size="10">a</tspan><tspan dy="-4">​</tspan> + r<tspan dy="4" font-size="10">m</tspan><tspan dy="-4">​</tspan> = 1 để có nghiệm duy nhất:</text><rect x="300.0" y="208.0" width="320.0" height="36.0" rx="5" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1.3"/><text x="460.0" y="231.0" font-size="14" fill="#003C43" text-anchor="middle" font-weight="600">r(y) = 2/5,   r(a) = 2/5,   r(m) = 1/5</text></svg>
